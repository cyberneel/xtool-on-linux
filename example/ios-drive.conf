# Copy to ~/.config/ios-drive.conf. Only needed when the iPhone is plugged into another machine.

# Machines that share their usbmuxd over the tailnet (systemd/usbmux-share.service), tried in
# order; whichever actually has the iPhone plugged in wins (see `ios-host --all`). The local
# /var/run/usbmuxd socket is always tried first, so a phone plugged into this box needs no config.
usbmux_hosts = 100.64.0.10:27015, 100.64.0.11:27015

# Pin one host instead of probing (overrides usbmux_hosts):
# usbmux = 100.64.0.10:27015
